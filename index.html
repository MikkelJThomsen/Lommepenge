<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>Lommepenge</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>💰 Lommepenge</h1><p id="who">Familien</p></div>
      <button id="logout" class="ghost hidden">Log ud</button>
    </header>

    <section id="login" class="card">
      <h2>Log ind</h2>
      <label>E-mail<input id="email" type="email" autocomplete="email"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password"></label>
      <button id="loginBtn">Log ind</button>
      <p id="loginMsg" class="msg"></p>
    </section>

    <div id="app" class="hidden">
      <section class="balances">
        <article class="balance"><span>Julius</span><strong id="saldoJ">–</strong></article>
        <article class="balance"><span>Rosa</span><strong id="saldoR">–</strong></article>
      </section>

      <nav id="nav">
        <button data-tab="tasks" class="active">Opgaver</button>
        <button data-tab="history">Historik</button>
        <button data-tab="parent" id="parentTab" class="hidden">Forælder</button>
      </nav>

      <section id="tasks" class="tab card">
        <h2>Opgaver</h2>
        <div id="taskList"></div>
      </section>

      <section id="history" class="tab card hidden">
        <h2>Historik</h2>
        <div id="historyList"></div>
      </section>

      <section id="parent" class="tab hidden">
        <article class="card">
          <h2>Afventer godkendelse</h2>
          <div id="pendingList"></div>
        </article>

        <article class="card">
          <h2>Ny opgave</h2>
          <label>Titel<input id="newTitle"></label>
          <label>Beskrivelse<textarea id="newDesc"></textarea></label>
          <div class="grid2">
            <label>Beløb<input id="newAmount" type="number" min="0.01" step="0.5"></label>
            <label>Tildel<select id="newAssignee"><option value="julius">Julius</option><option value="rosa">Rosa</option><option value="begge">Begge</option></select></label>
          </div>
          <label>Gentagelse<select id="newRepeat"><option value="engang">Én gang</option><option value="daglig">Daglig</option><option value="ugentlig">Ugentlig</option></select></label>
          <button id="createTask">Opret opgave</button>
        </article>

        <article class="card">
          <h2>Køb / udbetaling</h2>
          <div class="grid2">
            <label>Barn<select id="deductChild"><option>Julius</option><option>Rosa</option></select></label>
            <label>Type<select id="deductType"><option value="koeb">Køb</option><option value="udbetaling">Udbetaling</option></select></label>
          </div>
          <label>Beløb<input id="deductAmount" type="number" min="0.01" step="0.5"></label>
          <label>Beskrivelse<input id="deductDesc" placeholder="Fx nye høretelefoner"></label>
          <button id="deductBtn">Registrer</button>
        </article>
      </section>
    </div>
  </main>

  <dialog id="pinDialog">
    <form method="dialog" class="card">
      <h2>Forældre-PIN</h2>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••">
      <div class="actions"><button value="cancel" class="ghost">Annuller</button><button id="pinOk" value="default">Fortsæt</button></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
